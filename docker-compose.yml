# SQL Server 2022 Developer edition for local development.
# On an Apple Silicon Mac (M1–M4): Docker Desktop > Settings > General >
# "Use Rosetta for x86_64/amd64 emulation on Apple Silicon" must be on.
#
#   docker compose up -d        start (first run downloads ~1.5 GB)
#   docker compose ps           wait until the status shows "healthy"
#   docker compose down         stop (the data stays in the volume)
#   docker compose down -v      stop and delete the data
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: impianti-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Local development only. Must match the SqlServer connection string in appsettings.json.
      MSSQL_SA_PASSWORD: "Impianti_Dev_2026!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
